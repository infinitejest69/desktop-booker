[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Optimised release builds: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Build dependencies (SQLite, sqlx, Tauri…) optimised even in debug builds.
# Our own crates stay quick to rebuild, but database-heavy work such as
# loading the demo hotel runs faster in `pnpm tauri dev`.
[profile.dev.package."*"]
opt-level = 2
