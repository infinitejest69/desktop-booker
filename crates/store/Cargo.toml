[package]
name = "booker-store"
description = "SQLite persistence: migrations, repositories, backups"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
booker-core = { path = "../core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde = "1.0.229"
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
