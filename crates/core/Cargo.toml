[package]
name = "booker-core"
description = "Pure domain logic: availability, rates, invoices (no I/O)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["uuid-impl", "serde-compat"], optional = true }
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[lints]
workspace = true

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
serde_json = "1.0.154"
