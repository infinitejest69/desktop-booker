[package]
name = "booker-core"
description = "Pure domain logic: availability, rates, invoices (no I/O)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["uuid-impl", "serde-compat", "chrono-impl"], optional = true }
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[lints]
workspace = true

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
proptest = "1.12.0"
serde_json = "1.0.154"
