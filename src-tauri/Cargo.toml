[package]
name = "desktop-booker"
version.workspace = true
description = "Offline hotel booking app"
authors = ["Andy Lumsden"]
edition.workspace = true
# `cargo run` (and `pnpm tauri dev`) runs the app, not the demo bridge.
default-run = "desktop-booker"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_booker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The dev-only demo bridge for screenshots and videos (Phase 11). Not part
# of the app: `cargo run -p desktop-booker --bin demo-bridge --features demo-bridge`.
[[bin]]
name = "demo-bridge"
path = "src/bin/demo_bridge.rs"
required-features = ["demo-bridge"]

[features]
demo-bridge = ["tauri/test"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
booker-core = { path = "../crates/core" }
booker-store = { version = "0.1.0", path = "../crates/store" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
booker-services = { version = "0.1.0", path = "../crates/services" }
tauri-plugin-dialog = "2"

[lints]
workspace = true
