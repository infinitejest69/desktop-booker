name: Bug report
description: Something isn't working as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please don't include real guest details. If you can, show the problem with the demo hotel."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: "1. Open Bookings\n2. …"
  - type: input
    id: version
    attributes:
      label: DesktopBooker version
      placeholder: "0.1.0"
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
