name: Release

# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to build
# installers for Windows, Linux and macOS and attach them to a draft GitHub
# Release. Check the draft, then publish it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 keeps the AppImage working on older Linux too.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds MSI + NSIS on Windows, AppImage + .deb on Linux and .dmg on
      # macOS (unsigned for now), and uploads them to the draft release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DesktopBooker ${{ github.ref_name }}
          releaseBody: See the README for installing. Windows and macOS builds are unsigned, so the system may ask you to confirm the first time.
          releaseDraft: true
          prerelease: false
