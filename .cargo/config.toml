[env]
# ts-rs writes generated TypeScript bindings here when running
# `cargo test -p booker-core --features ts` (see `pnpm gen:types`).
TS_RS_EXPORT_DIR = { value = "src/lib/bindings", relative = true }
# Money is i64 minor units; emit it as a plain JS number (safe up to 2^53 pence).
TS_RS_LARGE_INT = "number"
